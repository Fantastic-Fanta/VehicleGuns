org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Kotlin
kff_version=5.12.0
kff_version_range=[5,)

# Fabric
fabric_loader_version=0.19.5
fabric_loader_version_range=>=0.16.10
fabric_api_version=0.116.17+1.21.1
flk_version=1.13.12+kotlin.2.4.0

# Mod
mod_id=vehicleguns
mod_name=Vehicle Guns
mod_license=MIT
mod_version=0.1.0
mod_group_id=dev.vehicleguns
mod_authors=Fantastic Fanta
mod_description=Crewed and self-guarding turrets for any vehicle: ballistic laying, a gunner's camera and sight, and shells that burst.

# The JVM on macOS inherits the system HTTP proxy. Some proxies break TLS to Mojang's hosts, so route those directly.
systemProp.http.nonProxyHosts=localhost|127.*|[::1]|*.minecraft.net|*.mojang.com|*.minecraftservices.com
